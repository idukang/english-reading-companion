name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 编译 debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/EnglishReadingCompanion-v1.0.0.apk
          (cd dist && sha256sum EnglishReadingCompanion-v1.0.0.apk > SHA256SUMS.txt)
          ls -lh dist
          cat dist/SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: english-reading-companion-apk
          path: dist/*
          if-no-files-found: error

      - name: 发布到 Release v1.0.0
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 --title "英语陪读 v1.0.0" --notes-file RELEASE_NOTES.md
          gh release upload v1.0.0 dist/EnglishReadingCompanion-v1.0.0.apk dist/SHA256SUMS.txt --clobber
          echo "release: $(gh release view v1.0.0 --json url -q .url)"
